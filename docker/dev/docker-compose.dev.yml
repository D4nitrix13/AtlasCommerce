# Docker Compose — Entorno de desarrollo local.
# Levanta el stack completo (postgres + redis + ftp + backend + frontend)
# con los Dockerfiles `.dev` que montan bind mounts para hot reload.
#
# Diferencias vs los compose de `docker/instances/<nombre>/`:
#   - Usa `Dockerfile.backend.dev` y `Dockerfile.frontend.dev`.
#   - El código (`backend/` y `frontend/`) se monta como bind mount,
#     no se copia a la imagen. Cambios se ven sin rebuild.
#   - NO toca los volúmenes nombrados de las instancias de prod.
#   - NO usa Caddy interno; el dev usa Caddy del host (ver
#     `scripts/setup-local.sh`) o `astro dev` directo en :4321.
#
# Uso:
#   docker compose -f docker/dev/docker-compose.dev.yml --env-file docker/dev/.env up -d
#
# Tear down (conservando datos):
#   docker compose -f docker/dev/docker-compose.dev.yml --env-file docker/dev/.env down
#
# Tear down completo (BORRA DB, Redis y FTP):
#   docker compose -f docker/dev/docker-compose.dev.yml --env-file docker/dev/.env down -v
#
# Las versiones de imágenes se resuelven desde `docker/versions.env`
# (con defaults embebidos en cada `image:`).

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:18-3.6}
    container_name: ecommerce-dev-postgres
    restart: unless-stopped
    env_file:
      - .env
      - ../versions.env
    ports:
      - "${POSTGRES_PORT:-6432}:5432"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - ../conf/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ecommerce_dev_postgres_data:/var/lib/postgresql
      - ../../database/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ecommerce-dev-redis
    restart: unless-stopped
    env_file:
      - ../versions.env
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    volumes:
      - ../conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-7379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev

  ftp:
    image: ${VSFTPD_IMAGE:-fauria/vsftpd}
    container_name: ecommerce-dev-ftp
    restart: unless-stopped
    env_file:
      - .env
      - ../versions.env
    ports:
      - "${FTP_PORT:-2121}:21"
      - "40000-40100:40000-40100"
    environment:
      - FTP_USER=${FTP_USERNAME}
      - FTP_PASS=${FTP_PASSWORD}
      - FTP_HOME=/srv/ftp
      - PASV_ENABLE=YES
      - PASV_MIN_PORT=40000
      - PASV_MAX_PORT=40100
      - PASV_ADDRESS=${FTP_PASV_ADDRESS:-127.0.0.1}
    volumes:
      - ecommerce_dev_ftp_data:/srv/ftp
    networks:
      - dev

  backend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.backend.dev
    container_name: ecommerce-dev-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - ../../backend:/var/www/html
      - ecommerce_dev_storage:/var/www/html/storage
      - ecommerce_dev_bootstrap:/var/www/html/bootstrap/cache
      - ecommerce_dev_logs:/var/log/php
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:${BACKEND_PORT:-9000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
      - FTP_HOST=ftp
      - FTP_PORT=21
      - FTP_USERNAME=${FTP_USERNAME}
      - FTP_PASSWORD=${FTP_PASSWORD}
      - FTP_ROOT=/srv/ftp
      - LOG_CHANNEL=stderr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev

  frontend:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.frontend.dev
    container_name: ecommerce-dev-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5321}:4321"
    volumes:
      - ../../frontend:/app
      - ../../frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ecommerce_dev_node_modules:/app/node_modules
      - ecommerce_dev_pnpm_store:/app/.pnpm-store
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-9000}/api
      - ASTRO_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks:
      - dev

networks:
  dev:
    name: ecommerce-dev

volumes:
  ecommerce_dev_postgres_data:
    name: ecommerce_dev_postgres_data
  ecommerce_dev_storage:
    name: ecommerce_dev_storage
  ecommerce_dev_bootstrap:
    name: ecommerce_dev_bootstrap
  ecommerce_dev_logs:
    name: ecommerce_dev_logs
  ecommerce_dev_ftp_data:
    name: ecommerce_dev_ftp_data
  ecommerce_dev_node_modules:
    name: ecommerce_dev_node_modules
  ecommerce_dev_pnpm_store:
    name: ecommerce_dev_pnpm_store