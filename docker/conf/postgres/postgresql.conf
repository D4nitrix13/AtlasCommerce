# postgresql.conf — Producción
# Configuración del contenedor Postgres/PostGIS.
# Los valores sensibles (passwords) siguen en variables de entorno
# que el entrypoint de la imagen oficial expande al primer arranque.

# ---------- Conexiones ----------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ---------- Memoria ----------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB
huge_pages = try

# ---------- WAL ----------
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

# ---------- Planner ----------
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------- Logging ----------
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_rotation_age = '1d'
log_rotation_size = '100MB'
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p]: db=%d,user=%u,app=%a '

# ---------- Locale ----------
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ---------- Stats ----------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# ---------- Autovacuum ----------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50