; php.ini — Producción
; Configuración base de PHP para el backend Laravel en contenedor.
; Se monta en /usr/local/etc/php/conf.d/zz-app.ini (zz para que pise a los demás).

[PHP]
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 50M
post_max_size = 50M
max_input_vars = 3000
default_socket_timeout = 60
date.timezone = UTC

[Date]
date.timezone = UTC

[Assertion]
zend.assertions = -1

[mbstring]
mbstring.internal_encoding = UTF-8