# redis.conf — Producción
# Configuración del contenedor Redis para cache/sessions/queues.
# Las contraseñas y límites duros vienen por variables de entorno
# que el entrypoint expande en /etc/redis/redis-runtime.conf y luego
# incluye este archivo con `include`.

# ---------- Red ----------
bind 0.0.0.0 -::*
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ---------- Memoria ----------
# Asignamos un tope blando y dejamos al kernel OOM matar si se pasa.
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ---------- Persistencia ----------
# RDB snapshots cada 5 min si hay al menos 100 keys modificadas.
save 300 100
save 60 1000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF deshabilitado por default. Activar si la instancia lo necesita
# (recomendado solo para queues con REQUIRE persistencia).
appendonly no

# ---------- Slow log ----------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# ---------- Logs ----------
loglevel notice
logfile ""

# ---------- Clientes ----------
maxclients 10000

# ---------- Includes runtime ----------
include /etc/redis/redis-runtime.conf