# vsftpd.conf — Producción
# Servidor FTP para uploads de productos/assets por tenant.
# Los volúmenes del contenedor persisten en
# `docker/instances/<instancia>/ftp-data/`.
#
# Credenciales: se generan en el primer arranque del contenedor vía
# `docker-entrypoint.sh` (variables FTP_USER y FTP_PASSWORD).
#
# Diseño: el admin sube por FTP a `/srv/ftp/<tenant>/...`; la app
# Laravel consume vía `Storage::disk('ftp')` apuntando a la misma
# ruta. Los assets servidos al público van por Caddy con un
# `basicauth` opcional.

# ---------- Modo ----------
listen=YES
listen_ipv6=NO

# ---------- Anonimato y usuarios locales ----------
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
virtual_use_local_privs=YES

# ---------- Logs ----------
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/var/log/vsftpd/xferlog
vsftpd_log_file=/var/log/vsftpd/vsftpd.log
log_ftp_protocol=YES

# ---------- Banner ----------
ftpd_banner=Bienvenido al servicio FTP del ecommerce.

# ---------- Limites ----------
max_clients=50
max_per_ip=10
idle_session_timeout=600
data_connection_timeout=120
local_max_rate=10485760

# ---------- SSL (comentado por default; activar en prod con cert) ----------
#ssl_enable=YES
#allow_anon_ssl=NO
#force_local_data_ssl=YES
#force_local_logins_ssl=YES
#ssl_tlsv1=YES
#ssl_sslv2=NO
#ssl_sslv3=NO
#rsa_cert_file=/etc/ssl/private/vsftpd.pem
#rsa_private_key_file=/etc/ssl/private/vsftpd.pem

# ---------- Pasividad ----------
# Rango a abrir para conexiones PASV (clientes detrás de NAT/firewall).
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
#pasv_address=<IP_PUBLICA>