# Docker Compose — Dev stack para MM Boutique (single-tenant).
# Stack independiente con su propia BD, Redis, FTP, backend y frontend.
# Pensado para iterar el código del backend/frontend (bind mounts)
# con datos aislados de los otros stores.
#
# Puertos shifted +1000 sobre defaults (iguales que el dev genérico):
#   postgres  6432  (5432 + 1000)
#   redis     7379  (6379 + 1000)
#   backend   9000  (8000 + 1000)
#   frontend  5321  (4321 + 1000)
#   ftp        21   (sin shift; cambia con FTP_PORT en .env)
#
# Solo un stack de dev puede estar corriendo a la vez (todos usan
# los mismos puertos del host). Para correr varios a la vez, override
# los *_PORT en el .env correspondiente.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:18-3.6}
    # Run as postgres user (UID 999). El command: con ruta absoluta
    # bypasea el docker-entrypoint.sh (gosu postgres), por eso hay que
    # setear user: explícito. Sin esto, postgres rehúsa correr como root.
    user: "999:999"
    container_name: morales-store-dev-postgres
    restart: unless-stopped
    env_file:
      - environment/.env
      - ../../../versions.env
    ports:
      - "${POSTGRES_PORT:-6432}:5432"
    command:
      - /usr/lib/postgresql/18/bin/postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - ./conf/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ecommerce_morales_store_dev_postgres_data:/var/lib/postgresql
      - ../../database/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morales-store-dev

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: morales-store-dev-redis
    restart: unless-stopped
    env_file:
      - ../../../versions.env
    command:
      - /usr/local/bin/redis-server
      - /usr/local/etc/redis/redis.conf
    volumes:
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-7379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morales-store-dev

  ftp:
    image: ${VSFTPD_IMAGE:-fauria/vsftpd}
    container_name: morales-store-dev-ftp
    restart: unless-stopped
    env_file:
      - environment/.env
      - ../../../versions.env
    ports:
      - "${FTP_PORT:-2121}:21"
      - "${FTP_PASV_MIN_PORT:-40000}-${FTP_PASV_MAX_PORT:-40100}:${FTP_PASV_MIN_PORT:-40000}-${FTP_PASV_MAX_PORT:-40100}"
    environment:
      - FTP_USER=${FTP_USERNAME}
      - FTP_PASS=${FTP_PASSWORD}
      - FTP_HOME=/srv/ftp
      - PASV_ENABLE=YES
      - PASV_MIN_PORT=${FTP_PASV_MIN_PORT:-40000}
      - PASV_MAX_PORT=${FTP_PASV_MAX_PORT:-40100}
      - PASV_ADDRESS=${FTP_PASV_ADDRESS:-127.0.0.1}
    volumes:
      - ecommerce_morales_store_dev_ftp_data:/srv/ftp
    networks:
      - morales-store-dev

  backend:
    build:
      context: ../../../..
      dockerfile: docker/instances/development/morales-store/backend/Dockerfile.development
    container_name: morales-store-dev-backend
    restart: unless-stopped
    # Run as host UID (typically 1000) so bind-mounted backend code is
    # readable/writable. The Dockerfile's USER www-data would otherwise
    # be overridden by the compose file's `user:` directive. In dev the
    # host UID is exported automatically by docker-stack.sh.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # tini: PID 1 = init, reaps zombies, forwards signals. Needed for
    # proper shutdown of php-fpm and child processes.
    init: true
    env_file:
      - environment/.env
    volumes:
      - ../../../../backend:/var/www/html
      - ecommerce_morales_store_dev_storage:/var/www/html/storage
      - ecommerce_morales_store_dev_bootstrap:/var/www/html/bootstrap/cache
      - ecommerce_morales_store_dev_logs:/var/log/php
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:${BACKEND_PORT:-9000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-morales-store}
      - DB_USERNAME=${POSTGRES_USER:-morales-store}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-devpass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
      - FTP_HOST=ftp
      - FTP_PORT=21
      - FTP_USERNAME=${FTP_USERNAME:-dev-ftp}
      - FTP_PASSWORD=${FTP_PASSWORD:-dev-ftp-pass}
      - FTP_ROOT=/srv/ftp
      - LOG_CHANNEL=stderr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - morales-store-dev

  # Sidecar nginx — agrega capa HTTP para que Caddy (en host) pueda
  # hacer `reverse_proxy localhost:${BACKEND_PORT}` con transporte HTTP
  # y no FastCGI. Mismo patrón que en panda-estampados y mm-boutique.
  #
  # Cadena de requests:
  #   curl host:${BACKEND_PORT} → nginx:8000 (sidecar, vía port mapping)
  #                          → FPM:9000 (vía Docker DNS `backend`)
  nginx:
    image: nginx:1.27-alpine
    container_name: morales-store-dev-nginx
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../../backend:/var/www/html:ro
    depends_on:
      - backend
    networks:
      - morales-store-dev
    # Cadena de requests (host → Caddy → nginx → FPM):
    #   curl host:${BACKEND_PORT:-9000}  → nginx:8000 (sidecar, vía port mapping)
    #                                 → backend:9000 (FPM, vía Docker DNS)

  frontend:
    build:
      context: ../../../..
      dockerfile: docker/instances/development/morales-store/frontend/Dockerfile.development
    container_name: morales-store-dev-frontend
    restart: unless-stopped
    # El entrypoint del Dockerfile hace chown de los volúmenes (root) y
    # después setpriv para correr pnpm como node (UID 1000, mismo que
    # el host user). NO usar `user: HOST_UID:HOST_GID` aquí: eso
    # bypasea el chown del entrypoint y el container arranca como node
    # con volúmenes owned by root → EACCES en /app/.pnpm-store.
    # tini: PID 1 = init, reaps zombies, forwards signals. Needed for
    # proper shutdown of astro dev and vite child processes.
    init: true
    env_file:
      - environment/.env
    ports:
      - "${FRONTEND_PORT:-5321}:4321"
    volumes:
      - ../../../../frontend:/app
      - ../../../../frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ecommerce_morales_store_dev_node_modules:/app/node_modules
      - ecommerce_morales_store_dev_pnpm_store:/app/.pnpm-store
      # Named volumes shadow the bind-mount so stale .astro/ or
      # .vite/ caches from the host don't break the dev server with
      # phantom lock files. Named (vs anonymous) so they survive
      # between `up` runs and can be cleaned up surgically with
      # `docker volume rm <name>` when a stale lock file breaks the
      # startup (incident 2026-08-17).
      - ecommerce_morales_store_dev_astro_cache:/app/.astro
      - ecommerce_morales_store_dev_vite_cache:/app/node_modules/.vite
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
      # PUBLIC_API_URL relativo (/api) para que el browser use el
      # origin actual y Caddy rutee con Host header correcto.
      - PUBLIC_API_URL=/api
      - ASTRO_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks:
      - morales-store-dev

  # Mailpit: SMTP catcher para dev. Ver docker/instances/development/
  # panda-estampados/docker-compose.yml para detalles. UI expuesta
  # en :28025 y SMTP en :12025 para no chocar con otros stacks.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    container_name: ${MAILPIT_NAME:-morales-store-dev-mailpit}
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-12025}:1025"
      - "${MAILPIT_UI_PORT:-28025}:8025"
    networks:
      - morales-store-dev

networks:
  morales-store-dev:
    name: ecommerce-morales-store-dev

volumes:
  ecommerce_morales_store_dev_postgres_data:
    name: ecommerce_morales_store_dev_postgres_data
  ecommerce_morales_store_dev_storage:
    name: ecommerce_morales_store_dev_storage
  ecommerce_morales_store_dev_bootstrap:
    name: ecommerce_morales_store_dev_bootstrap
  ecommerce_morales_store_dev_logs:
    name: ecommerce_morales_store_dev_logs
  ecommerce_morales_store_dev_ftp_data:
    name: ecommerce_morales_store_dev_ftp_data
  ecommerce_morales_store_dev_node_modules:
    name: ecommerce_morales_store_dev_node_modules
  ecommerce_morales_store_dev_pnpm_store:
    name: ecommerce_morales_store_dev_pnpm_store
  ecommerce_morales_store_dev_astro_cache:
    name: ecommerce_morales_store_dev_astro_cache
  ecommerce_morales_store_dev_vite_cache:
    name: ecommerce_morales_store_dev_vite_cache
