# nginx dev config — reverse proxy to PHP-FPM via FastCGI
#
# Para la instancia dev, este nginx vive como sidecar del container
# `backend` (comparten el volume `/var/www/html`). Su único propósito
# es exponer HTTP en puerto 8000 para que Caddy (en host, puerto 9000
# vía docker port-mapping) pueda hacer `reverse_proxy localhost:9000`
# sin tener que hablar FastCGI directamente.
#
# Si en el futuro se quiere el mismo setup en prod, este archivo es
# reutilizable punto por punto.
server {
    listen 8000 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Logs a stdout/stderr para que `docker logs` los muestre.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Deny dotfiles por seguridad.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Recursos estáticos servidos por nginx directamente (no FPM).
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Front controller de Laravel: cualquier URL que no matchee un
    # archivo físico se redirige a index.php, que FPM ejecuta.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI → FPM (servicio `backend` dentro de la red Docker).
    #
    # IMPORTANTE: usar `set $upstream "backend:9000"` + `resolver 127.0.0.11
    # valid=10s` en vez de `fastcgi_pass backend:9000` directo.
    # Razón: nginx cachea la resolución DNS al startup. Si el container
    # `backend` se recrea (ej: cambio en env_file → up recrea), Docker le
    # asigna una IP nueva. nginx NO se recrea junto (su config no cambia)
    # y se queda con la IP vieja → 502 Connection refused.
    #
    # Con `resolver 127.0.0.11 valid=10s` nginx re-resuelve `backend`
    # cada 10s via el DNS interno de Docker (127.0.0.11:53), asique
    # pilla la nueva IP solo sin necesidad de recreate.
    #
    # Portabilidad K8s: en Kubernetes cambiar el resolver a
    # `kube-dns.kube-system.svc.cluster.local` y el upstream al FQDN
    # del Service (ej: `backend.panda-estampados-dev.svc.cluster.local`).
    # Mismo patrón, sin reescribir nada.
    location ~ \.php$ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $upstream "backend:9000";
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # Timeouts generosos para Laravel artisan y jobs pesados.
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Ocultar signature de nginx en headers.
    server_tokens off;
}
