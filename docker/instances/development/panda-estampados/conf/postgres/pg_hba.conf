# pg_hba.conf — instancia dev
#
# Permisivo para que cualquier container dentro del rango docker
# network pueda conectar. Producción debería usar md5/scram y
# limitar a IPs específicas.
#
# type  database  user  address         method
local   all       all                    trust
host    all       all  127.0.0.1/32     trust
host    all       all  ::1/128          trust
# DEV ONLY: redes Docker (172.16.0.0/12 cubre 172.16-172.31).
host    all       all  172.16.0.0/12    trust
