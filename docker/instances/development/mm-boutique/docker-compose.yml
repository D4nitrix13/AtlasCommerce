# Docker Compose — Dev stack para MM Boutique (single-tenant).
# Stack independiente con su propia BD, Redis, FTP, backend y frontend.
# Pensado para iterar el código del backend/frontend (bind mounts)
# con datos aislados de los otros stores.
#
# Puertos shifted +1000 sobre defaults (iguales que el dev genérico):
#   postgres  6432  (5432 + 1000)
#   redis     7379  (6379 + 1000)
#   backend   9000  (8000 + 1000)
#   frontend  5321  (4321 + 1000)
#   ftp        21   (sin shift; cambia con FTP_PORT en .env)
#
# Solo un stack de dev puede estar corriendo a la vez (todos usan
# los mismos puertos del host). Para correr varios a la vez, override
# los *_PORT en el .env correspondiente.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:18-3.6}
    container_name: mm-boutique-dev-postgres
    restart: unless-stopped
    env_file:
      - environment/.env
      - ../../../versions.env
    ports:
      - "${POSTGRES_PORT:-6432}:5432"
    # El entrypoint oficial de la imagen `postgis/postgis:18-3.6` se encarga
    # de correr `initdb` si $PGDATA está vacío (primera instalación) y de
    # hacer `gosu postgres` para correr el proceso final como postgres.
    # El `command:` pasa `postgres -c config_file=...` para que el entrypoint
    # reconozca el primer arg y aplique el gosu correctamente. (Si se pasa la
    # ruta absoluta, el entrypoint no matchea contra `postgres` y se saltea
    # el gosu → postgres arranca como root y refuse start.)
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - ./conf/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ecommerce_mm_boutique_dev_postgres_data:/var/lib/postgresql
      - ../../database/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mm-boutique-dev

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: mm-boutique-dev-redis
    restart: unless-stopped
    env_file:
      - ../../../versions.env
    command:
      - /usr/local/bin/redis-server
      - /usr/local/etc/redis/redis.conf
    # Named en /data para evitar volumenes anonimos de la imagen redis:7-alpine.
    volumes:
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ecommerce_mm_boutique_dev_redis_data:/data
    ports:
      - "${REDIS_PORT:-7379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mm-boutique-dev

  ftp:
    image: ${VSFTPD_IMAGE:-fauria/vsftpd}
    container_name: mm-boutique-dev-ftp
    restart: unless-stopped
    env_file:
      - environment/.env
      - ../../../versions.env
    ports:
      - "${FTP_PORT:-2121}:21"
      - "${FTP_PASV_MIN_PORT:-40000}-${FTP_PASV_MAX_PORT:-40100}:${FTP_PASV_MIN_PORT:-40000}-${FTP_PASV_MAX_PORT:-40100}"
    environment:
      - FTP_USER=${FTP_USERNAME}
      - FTP_PASS=${FTP_PASSWORD}
      - FTP_HOME=/srv/ftp
      - PASV_ENABLE=YES
      - PASV_MIN_PORT=${FTP_PASV_MIN_PORT:-40000}
      - PASV_MAX_PORT=${FTP_PASV_MAX_PORT:-40100}
      - PASV_ADDRESS=${FTP_PASV_ADDRESS:-127.0.0.1}
    # Named para los VOLUMEs anonimos de la imagen fauria/vsftpd.
    volumes:
      - ecommerce_mm_boutique_dev_ftp_home:/home/vsftpd
      - ecommerce_mm_boutique_dev_ftp_data:/srv/ftp
      - ecommerce_mm_boutique_dev_ftp_logs:/var/log/vsftpd
    networks:
      - mm-boutique-dev

  backend:
    build:
      context: ../../../..
      dockerfile: docker/instances/development/mm-boutique/backend/Dockerfile.development
    container_name: mm-boutique-dev-backend
    restart: unless-stopped
    # Run as host UID (typically 1000) so bind-mounted backend code is
    # readable/writable. The Dockerfile's USER www-data would otherwise
    # be overridden by the compose file's `user:` directive. In dev the
    # host UID is exported automatically by docker-stack.sh.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # tini: PID 1 = init, reaps zombies, forwards signals. Needed for
    # proper shutdown of php-fpm and child processes.
    init: true
    env_file:
      - environment/.env
    volumes:
      - ../../../../backend:/var/www/html
      - ecommerce_mm_boutique_dev_storage:/var/www/html/storage
      - ecommerce_mm_boutique_dev_bootstrap:/var/www/html/bootstrap/cache
      - ecommerce_mm_boutique_dev_logs:/var/log/php
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:${BACKEND_PORT:-9000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-mm-boutique}
      - DB_USERNAME=${POSTGRES_USER:-mm-boutique}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-devpass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
      - FTP_HOST=ftp
      - FTP_PORT=21
      - FTP_USERNAME=${FTP_USERNAME:-dev-ftp}
      - FTP_PASSWORD=${FTP_PASSWORD:-dev-ftp-pass}
      # Sanctum stateful hosts (los hosts desde los que se aceptan cookies
      # httpOnly stateful). Multi-tenant: cada tenant × env. Forzado en
      # compose para que Dotenv (que NO override existing env vars) lo vea.
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:3000,localhost:4321,panda-estampados-and-kitsune.test,www.panda-estampados-and-kitsune.test,admin.panda-estampados-and-kitsune.test,kitsune.test,www.kitsune.test,admin.kitsune.test,mm-boutique.test,www.mm-boutique.test,admin.mm-boutique.test,morales-store.test,www.morales-store.test,admin.morales-store.test,panda-estampados-and-kitsune.com,www.panda-estampados-and-kitsune.com,admin.panda-estampados-and-kitsune.com,kitsune.com,www.kitsune.com,admin.kitsune.com,mm-boutique.com,www.mm-boutique.com,admin.mm-boutique.com,morales-store.com,www.morales-store.com,admin.morales-store.com,127.0.0.1,127.0.0.1:8000
      # OAuth social login (Google + Facebook). Pegar creds en
      # environment/.env (NO en este compose). Vacíos → redirect 503.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL}
      - FTP_ROOT=/srv/ftp
      - LOG_CHANNEL=stderr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mm-boutique-dev

  # Sidecar nginx — agrega capa HTTP para que Caddy (en host) pueda
  # hacer `reverse_proxy localhost:${BACKEND_PORT}` con transporte HTTP
  # y no FastCGI. Mismo patrón que en panda-estampados-and-kitsune y morales-store.
  #
  # Cadena de requests:
  #   curl host:${BACKEND_PORT} → nginx:8000 (sidecar, vía port mapping)
  #                          → FPM:9000 (vía Docker DNS `backend`)
  nginx:
    image: nginx:1.27-alpine
    container_name: mm-boutique-dev-nginx
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../../backend:/var/www/html:ro
    depends_on:
      - backend
    networks:
      - mm-boutique-dev
    # Cadena de requests (host → Caddy → nginx → FPM):
    #   curl host:${BACKEND_PORT:-9000}  → nginx:8000 (sidecar, vía port mapping)
    #                                 → backend:9000 (FPM, vía Docker DNS)

  frontend:
    build:
      context: ../../../..
      dockerfile: docker/instances/development/mm-boutique/frontend/Dockerfile.development
    container_name: mm-boutique-dev-frontend
    restart: unless-stopped
    # El entrypoint del Dockerfile hace chown de los volúmenes (root) y
    # después setpriv para correr pnpm como node (UID 1000, mismo que
    # el host user). NO usar `user: HOST_UID:HOST_GID` aquí: eso
    # bypasea el chown del entrypoint y el container arranca como node
    # con volúmenes owned by root → EACCES en /app/.pnpm-store.
    # tini: PID 1 = init, reaps zombies, forwards signals. Needed for
    # proper shutdown of astro dev and vite child processes.
    init: true
    env_file:
      - environment/.env
    ports:
      - "${FRONTEND_PORT:-5321}:4321"
    volumes:
      - ../../../../frontend:/app
      - ../../../../frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ecommerce_mm_boutique_dev_node_modules:/app/node_modules
      - ecommerce_mm_boutique_dev_pnpm_store:/app/.pnpm-store
      # Named volumes shadow the bind-mount so stale .astro/ or
      # .vite/ caches from the host don't break the dev server with
      # phantom lock files. Named (vs anonymous) so they survive
      # between `up` runs and can be cleaned up surgically with
      # `docker volume rm <name>` when a stale lock file breaks the
      # startup (incident 2026-08-17).
      - ecommerce_mm_boutique_dev_astro_cache:/app/.astro
      - ecommerce_mm_boutique_dev_vite_cache:/app/node_modules/.vite
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
      # PUBLIC_API_URL relativo (/api) para que el browser use el
      # origin actual y Caddy rutee con Host header correcto.
      - PUBLIC_API_URL=/api
      - ASTRO_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks:
      - mm-boutique-dev

  # Mailpit: SMTP catcher para dev. Ver docker/instances/development/
  # panda-estampados-and-kitsune/docker-compose.yml para detalles. UI expuesta
  # en el host en el puerto :18025 para no chocar con otros stacks.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    container_name: ${MAILPIT_NAME:-mm-boutique-dev-mailpit}
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-11025}:1025"
      - "${MAILPIT_UI_PORT:-18025}:8025"
    networks:
      - mm-boutique-dev

  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:latest}
    container_name: mm-boutique-dev-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@mm-boutique.test}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "${PGADMIN_PORT:-7050}:80"
    volumes:
      - ecommerce_mm_boutique_dev_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mm-boutique-dev

  redis-insight:
    image: ${REDIS_INSIGHT_IMAGE:-redis/redisinsight:latest}
    container_name: mm-boutique-dev-redis-insight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-7540}:5540"
    volumes:
      - ecommerce_mm_boutique_dev_redis_insight_data:/db
    depends_on:
      - redis
    networks:
      - mm-boutique-dev

  filebrowser:
    image: ${FILEBROWSER_IMAGE:-filebrowser/filebrowser:latest}
    container_name: mm-boutique-dev-filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-10080}:80"
    volumes:
      - ecommerce_mm_boutique_dev_ftp_data:/srv/ftp:ro
      - ecommerce_mm_boutique_dev_filebrowser_config:/config
      - ecommerce_mm_boutique_dev_filebrowser_db:/database
    networks:
      - mm-boutique-dev

networks:
  mm-boutique-dev:
    name: ecommerce-mm-boutique-dev

volumes:
  ecommerce_mm_boutique_dev_postgres_data:
    name: ecommerce_mm_boutique_dev_postgres_data
  ecommerce_mm_boutique_dev_storage:
    name: ecommerce_mm_boutique_dev_storage
  ecommerce_mm_boutique_dev_bootstrap:
    name: ecommerce_mm_boutique_dev_bootstrap
  ecommerce_mm_boutique_dev_logs:
    name: ecommerce_mm_boutique_dev_logs
  ecommerce_mm_boutique_dev_redis_data:
    name: ecommerce_mm_boutique_dev_redis_data
  ecommerce_mm_boutique_dev_redis_insight_data:
    name: ecommerce_mm_boutique_dev_redis_insight_data
  ecommerce_mm_boutique_dev_ftp_data:
    name: ecommerce_mm_boutique_dev_ftp_data
  ecommerce_mm_boutique_dev_ftp_home:
    name: ecommerce_mm_boutique_dev_ftp_home
  ecommerce_mm_boutique_dev_ftp_logs:
    name: ecommerce_mm_boutique_dev_ftp_logs
  ecommerce_mm_boutique_dev_pgadmin_data:
    name: ecommerce_mm_boutique_dev_pgadmin_data
  ecommerce_mm_boutique_dev_filebrowser_config:
    name: ecommerce_mm_boutique_dev_filebrowser_config
  ecommerce_mm_boutique_dev_filebrowser_db:
    name: ecommerce_mm_boutique_dev_filebrowser_db
  ecommerce_mm_boutique_dev_node_modules:
    name: ecommerce_mm_boutique_dev_node_modules
  ecommerce_mm_boutique_dev_pnpm_store:
    name: ecommerce_mm_boutique_dev_pnpm_store
  ecommerce_mm_boutique_dev_astro_cache:
    name: ecommerce_mm_boutique_dev_astro_cache
  ecommerce_mm_boutique_dev_vite_cache:
    name: ecommerce_mm_boutique_dev_vite_cache
