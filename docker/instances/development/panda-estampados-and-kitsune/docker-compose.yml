# Docker Compose — Dev stack para Panda Estampados + Kitsune (multi-tenant).
# Stack independiente con su propia BD, Redis, FTP, backend y frontend.
# Pensado para iterar el código del backend/frontend (bind mounts)
# con datos aislados de los otros stores.
#
# Puertos shifted +1000 sobre defaults (iguales que el dev genérico):
#   postgres  6432  (5432 + 1000)
#   redis     7379  (6379 + 1000)
#   backend   9000  (8000 + 1000)
#   frontend  5321  (4321 + 1000)
#   ftp        21   (sin shift; cambia con FTP_PORT en .env)
#
# Solo un stack de dev puede estar corriendo a la vez (todos usan
# los mismos puertos del host). Para correr varios a la vez, override
# los *_PORT en el .env correspondiente.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:18-3.6}
    container_name: panda-estampados-and-kitsune-dev-postgres
    restart: unless-stopped
    env_file:
      - environment/.env
      - ../../../versions.env
    ports:
      - "${POSTGRES_PORT:-6432}:5432"
    # El entrypoint oficial de la imagen `postgis/postgis:18-3.6` se encarga
    # de:
    #   1. Correr `initdb` si $PGDATA está vacío (primera instalación).
    #   2. Aplicar los scripts en /docker-entrypoint-initdb.d/.
    #   3. Hacer `gosu postgres` para correr el proceso final como postgres.
    # El `command:` pasa `postgres -c config_file=...` para que el entrypoint
    # reconozca el primer arg como `postgres` y aplique el gosu correctamente.
    # (Si se pasa la ruta absoluta `/usr/lib/postgresql/18/bin/postgres`, el
    # entrypoint no la matchea contra el string `postgres` y se saltea el
    # gosu → postgres arranca como root y refuse start.)
    volumes:
      - ./conf/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./conf/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - atlas_commerce_panda_estampados_and_kitsune_dev_postgres_data:/var/lib/postgresql
      - ../../database/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panda-estampados-and-kitsune-dev

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: panda-estampados-and-kitsune-dev-redis
    restart: unless-stopped
    env_file:
      - ../../../versions.env
    command:
      - /usr/local/bin/redis-server
      - /usr/local/etc/redis/redis.conf
    # Mount named en /data (VOLUME declarado por la imagen redis:7-alpine).
    # Sin esto, docker compose crea un volumen ANONIMO (etiqueta
    # `com.docker.volume.anonymous`) cada vez que se recrea el container.
    # Los anonymous son irrellamables en `docker volume ls` y confunden
    # con volumes de nuestras propias servicios.
    volumes:
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - atlas_commerce_panda_estampados_and_kitsune_dev_redis_data:/data
    ports:
      - "${REDIS_PORT:-7379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panda-estampados-and-kitsune-dev

  ftp:
    image: ${VSFTPD_IMAGE:-fauria/vsftpd}
    container_name: panda-estampados-and-kitsune-dev-ftp
    restart: unless-stopped
    env_file:
      - environment/.env
      - ../../../versions.env
    ports:
      - "${FTP_PORT:-2121}:21"
      - "${FTP_PASV_MIN_PORT:-40000}-${FTP_PASV_MAX_PORT:-40100}:${FTP_PASV_MIN_PORT:-40000}-${FTP_PASV_MAX_PORT:-40100}"
    environment:
      - FTP_USER=${FTP_USERNAME}
      - FTP_PASS=${FTP_PASSWORD}
      - FTP_HOME=/srv/ftp
      - PASV_ENABLE=YES
      - PASV_MIN_PORT=${FTP_PASV_MIN_PORT:-40000}
      - PASV_MAX_PORT=${FTP_PASV_MAX_PORT:-40100}
      - PASV_ADDRESS=${FTP_PASV_ADDRESS:-127.0.0.1}
    # La imagen fauria/vsftpd declara VOLUMEs anonimos en /home/vsftpd y
    # /var/log/vsftpd. Sin mounts explicitos aca, docker compose crea
    # volumenes ANONIMOS (hash-named) que ensucian `docker volume ls` y
    # se confunden con los de nuestras servicios. Los hacemos named:
    #   /home/vsftpd  → ftp_home  (metadata del FTP user chroot)
    #   /srv/ftp      → ftp_data  (uploads reales, ya estaba)
    #   /var/log/vsftpd → ftp_logs (logs del daemon vsftpd)
    volumes:
      - atlas_commerce_panda_estampados_and_kitsune_dev_ftp_home:/home/vsftpd
      - atlas_commerce_panda_estampados_and_kitsune_dev_ftp_data:/srv/ftp
      - atlas_commerce_panda_estampados_and_kitsune_dev_ftp_logs:/var/log/vsftpd
    networks:
      - panda-estampados-and-kitsune-dev

  backend:
    build:
      context: ../../../..
      dockerfile: docker/instances/development/panda-estampados-and-kitsune/backend/Dockerfile.development
    container_name: panda-estampados-and-kitsune-dev-backend
    restart: unless-stopped
    # Run as host UID (typically 1000) so bind-mounted backend code is
    # readable/writable. The Dockerfile's USER www-data would otherwise
    # be overridden by the compose file's `user:` directive. In dev the
    # host UID is exported automatically by docker-stack.sh.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # tini: PID 1 = init, reaps zombies, forwards signals. Needed for
    # proper shutdown of php-fpm and child processes.
    init: true
    env_file:
      - environment/.env
    volumes:
      - ../../../../backend:/var/www/html
      # brand-assets/: source of truth para logos + SVGs que el command
      # assets:sync-from-public lee y sube al FTP. Bind-mount para que
      # los cambios en el host se vean inmediatamente en el container.
      - ../../../../brand-assets:/var/www/html/brand-assets
      - atlas_commerce_panda_estampados_and_kitsune_dev_storage:/var/www/html/storage
      - atlas_commerce_panda_estampados_and_kitsune_dev_bootstrap:/var/www/html/bootstrap/cache
      - atlas_commerce_panda_estampados_and_kitsune_dev_logs:/var/log/php
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:${BACKEND_PORT:-9000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Sessions + cache en Redis (no en filesystem).
      # Razón: storage está owned por UID 0 (root del build), pero el
      # compose override corre como UID 1000 (host user). File driver
      # tira "Permission denied" al primer write. Redis evita el problema
      # y de paso es lo que usaremos en prod.
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local
      - FTP_HOST=ftp
      - FTP_PORT=21
      - FTP_USERNAME=${FTP_USERNAME:-dev-ftp}
      - FTP_PASSWORD=${FTP_PASSWORD:-dev-ftp-pass}
      - FTP_ROOT=/
      - LOG_CHANNEL=stderr
      # F0.x follow-up — Sanctum stateful cookies en dev. Sin este
      # env, /api/v1/auth/me desde un cliente browser (F1.1) responde
      # 401 porque Sanctum no reconoce el host como stateful. Lista
      # espejo de docker/caddy/Caddyfile @panda_dev handle (mismos
      # hosts que el dev Caddyfile enruta a esta instancia).
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:3000,localhost:4321,panda-estampados.com,www.panda-estampados.com,admin.panda-estampados.com,kitsune.com,www.kitsune.com,admin.kitsune.com,127.0.0.1,127.0.0.1:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # F0.x follow-up: el SSR del frontend hace fetch a `${Astro.url.origin}/api/*`
      # (same-origin). Para que el resolve DNS funcione dentro del container,
      # mapeamos los public hosts al gateway del docker network (que es donde
      # Caddy está bindeado en el host). Sin esto, la SSR fetch de
      # `getAccountDashboardData` retorna NXDOMAIN y la página muestra el
      # fallback "Cliente" en vez del user real.
      - "panda-estampados.com:host-gateway"
      - "www.panda-estampados.com:host-gateway"
      - "admin.panda-estampados.com:host-gateway"
      - "kitsune.com:host-gateway"
      - "www.kitsune.com:host-gateway"
      - "admin.kitsune.com:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - panda-estampados-and-kitsune-dev

  # Sidecar nginx para exponer HTTP en puerto 8000 del container
  # backend. Caddy (en host) hace `reverse_proxy localhost:9000` con
  # transporte HTTP, no FastCGI — necesita un HTTP server entre
  # Caddy y FPM. Este sidecar comparte el volume `/var/www/html`
  # con el backend y habla con FPM via `backend:9000` en la red
  # interna.
  #
  # Si en el futuro se replica el setup en prod, este mismo sidecar
  # + nginx.conf se pueden reutilizar; solo cambia el contexto del
  # `build`/`image` y el port mapping.
  nginx:
    image: nginx:1.27-alpine
    container_name: panda-estampados-and-kitsune-dev-nginx
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_PORT:-9000}:8000"
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../../backend:/var/www/html:ro
    depends_on:
      - backend
    networks:
      - panda-estampados-and-kitsune-dev
    # Cadena de requests (host → Caddy → nginx → FPM):
    #   curl host:5321              → frontend (Astro en container)
    #   curl host:9000              → nginx:8000 (sidecar, vía port mapping)
    #                              → backend:9000 (FPM, vía Docker DNS)

  frontend:
    build:
      context: ../../../..
      dockerfile: docker/instances/development/panda-estampados-and-kitsune/frontend/Dockerfile.development
    container_name: panda-estampados-and-kitsune-dev-frontend
    restart: unless-stopped
    # El entrypoint del Dockerfile hace chown de los volúmenes (root) y
    # después setpriv para correr pnpm como node (UID 1000, mismo que
    # el host user). NO usar `user: HOST_UID:HOST_GID` aquí: eso
    # bypasea el chown del entrypoint y el container arranca como node
    # con volúmenes owned by root → EACCES en /app/.pnpm-store.
    # tini: PID 1 = init, reaps zombies, forwards signals. Needed for
    # proper shutdown of astro dev and vite child processes.
    init: true
    env_file:
      - environment/.env
    ports:
      - "${FRONTEND_PORT:-5321}:4321"
    volumes:
      - ../../../../frontend:/app
      - ../../../../frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - atlas_commerce_panda_estampados_and_kitsune_dev_node_modules:/app/node_modules
      - atlas_commerce_panda_estampados_and_kitsune_dev_pnpm_store:/app/.pnpm-store
      # Named volumes enmascaran el bind-mount para que caches stale
      # (Astro `.astro/dev.json`, Vite `.vite/`) del host no rompan el
      # dev server con phantom lock files. Named (no anonymous) para
      # identificarlos en `docker volume ls` y permitir purgado
      # quirúrgico con `docker volume rm <name>` cuando el lock file
      # stale rompe el arranque (incident 2026-08-17).
      - atlas_commerce_panda_estampados_and_kitsune_dev_astro_cache:/app/.astro
      - atlas_commerce_panda_estampados_and_kitsune_dev_vite_cache:/app/node_modules/.vite
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
      # PUBLIC_API_URL debe ser RELATIVO (/api) para que el browser
      # use el origin actual (admin.panda-estampados.com) y Caddy
      # rutee con el Host header correcto. Si se setea absoluto a
      # localhost, el browser lo reemplaza y el backend no puede
      # resolver la tienda via ResolveStoreFromDomain middleware.
      - PUBLIC_API_URL=/api
      - ASTRO_TELEMETRY_DISABLED=1
      # Pnpm pide confirmación interactiva si node_modules/.pnpm está
      # en estado inválido (ej. residuos de un run anterior con owner
      # incorrecto). Sin TTY aborta. CI=true evita la pregunta y
      # deja a pnpm purgar el módulo dir y reinstalar.
      - CI=true
    depends_on:
      - backend
    networks:
      - panda-estampados-and-kitsune-dev

  # Mailpit: SMTP catcher para dev. Captura los emails que Laravel envía
  # (forgot-password, notifications varias) y los muestra en una UI web.
  # Levanta dos listeners:
  #   - :1025  SMTP (Laravel backend usa `MAIL_HOST=mailpit`)
  #   - :8025  Web UI (http://localhost:8025)
  # Se expone :8025 al host para inspección desde el browser del dev.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    container_name: ${MAILPIT_NAME:-panda-estampados-and-kitsune-dev-mailpit}
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - panda-estampados-and-kitsune-dev

  # pgAdmin: web UI para inspeccionar Postgres (tablas, queries, schema).
  # Conectado al postgres container via la red Docker interna.
  # Credenciales default: admin@panda-estampados-and-kitsune.example / admin.
  # CAMBIAR EN PROD via env vars (PGADMIN_DEFAULT_PASSWORD).
  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:latest}
    container_name: panda-estampados-and-kitsune-dev-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@panda-estampados-and-kitsune.example}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "${PGADMIN_PORT:-6050}:80"
    volumes:
      - atlas_commerce_panda_estampados_and_kitsune_dev_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - panda-estampados-and-kitsune-dev

  # Redis Insight: web UI oficial de Redis para inspeccionar keys,
  # memory usage, ejecutar comandos, ver streams.
  # Sin auth por default — Insight se conecta al redis container local.
  redis-insight:
    image: ${REDIS_INSIGHT_IMAGE:-redis/redisinsight:latest}
    container_name: panda-estampados-and-kitsune-dev-redis-insight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-6540}:5540"
    volumes:
      - atlas_commerce_panda_estampados_and_kitsune_dev_redis_insight_data:/db
    depends_on:
      - redis
    networks:
      - panda-estampados-and-kitsune-dev

  # Filebrowser: web UI para navegar el FTP del tenant (uploads).
  # Se monta el MISMO volume `ftp_data` que usa el container vsftpd,
  # asi que cualquier archivo que el backend suba al FTP aparece
  # inmediatamente acá (read-only para no corromper uploads).
  filebrowser:
    image: ${FILEBROWSER_IMAGE:-filebrowser/filebrowser:latest}
    container_name: panda-estampados-and-kitsune-dev-filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-9080}:80"
    volumes:
      - atlas_commerce_panda_estampados_and_kitsune_dev_ftp_data:/srv/ftp:ro
      - atlas_commerce_panda_estampados_and_kitsune_dev_filebrowser_config:/config
      - atlas_commerce_panda_estampados_and_kitsune_dev_filebrowser_db:/database
    networks:
      - panda-estampados-and-kitsune-dev

networks:
  panda-estampados-and-kitsune-dev:
    name: atlas-commerce-panda-estampados-and-kitsune-dev

volumes:
  atlas_commerce_panda_estampados_and_kitsune_dev_postgres_data:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_postgres_data
  atlas_commerce_panda_estampados_and_kitsune_dev_storage:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_storage
  atlas_commerce_panda_estampados_and_kitsune_dev_bootstrap:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_bootstrap
  atlas_commerce_panda_estampados_and_kitsune_dev_logs:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_logs
  atlas_commerce_panda_estampados_and_kitsune_dev_redis_data:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_redis_data
  atlas_commerce_panda_estampados_and_kitsune_dev_redis_insight_data:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_redis_insight_data
  atlas_commerce_panda_estampados_and_kitsune_dev_ftp_data:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_ftp_data
  atlas_commerce_panda_estampados_and_kitsune_dev_ftp_home:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_ftp_home
  atlas_commerce_panda_estampados_and_kitsune_dev_ftp_logs:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_ftp_logs
  atlas_commerce_panda_estampados_and_kitsune_dev_pgadmin_data:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_pgadmin_data
  atlas_commerce_panda_estampados_and_kitsune_dev_filebrowser_config:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_filebrowser_config
  atlas_commerce_panda_estampados_and_kitsune_dev_filebrowser_db:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_filebrowser_db
  atlas_commerce_panda_estampados_and_kitsune_dev_node_modules:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_node_modules
  atlas_commerce_panda_estampados_and_kitsune_dev_pnpm_store:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_pnpm_store
  atlas_commerce_panda_estampados_and_kitsune_dev_astro_cache:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_astro_cache
  atlas_commerce_panda_estampados_and_kitsune_dev_vite_cache:
    name: atlas_commerce_panda_estampados_and_kitsune_dev_vite_cache
