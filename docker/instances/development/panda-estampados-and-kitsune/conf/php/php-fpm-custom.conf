[www]

; Custom PHP-FPM pool overrides para AtlasCommerce dev.
;
; Laravel 13 hace error_reporting(-1) en HandleExceptions::bootstrap() y
; convierte cualquier PHP warning en ErrorException. El warning de
; tempnam() (PHP 8.x: "file created in the system's temporary
; directory") rompe TODOS los requests que pasan por Filesystem::link()
; o cualquier flujo que escriba archivos via Storage.
;
; Solucion: php_admin_value sobreescribe el nivel a runtime del pool
; (no es afectado por el -1 de HandleExceptions porque php_admin_value
; se aplica DESPUES del master pero ANTES del worker handling request).
;
; Valores excluidos:
;   E_WARNING          (2)         - tempnam() y similares
;   E_DEPRECATED       (8192)      - deprecations de Laravel
;   E_USER_DEPRECATED  (16384)     - deprecations de vendors

php_admin_value[error_reporting] = 6141

; sys_temp_dir a /tmp/laravel para evitar el warning especifico de PHP 8.5+
; sobre 'system temporary directory'. En PHP 8.4 este warning no existe,
; pero queda como defensive measure.
php_admin_value[sys_temp_dir] = /tmp/laravel