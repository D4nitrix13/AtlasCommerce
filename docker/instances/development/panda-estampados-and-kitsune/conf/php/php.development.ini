; PHP config para dev (errores visibles, xdebug, opcache off)
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_WARNING & ~E_DEPRECATED & ~E_USER_DEPRECATED

; sys_temp_dir a un dir NO estandar (/tmp/laravel) para evitar el warning
; de PHP 8.x sobre tempnam() cuando crea archivos en /tmp (el path
; "system temporary directory"). Laravel 13 convierte cualquier warning
; en 500 Internal Server Error via HandleExceptions.
sys_temp_dir = /tmp/laravel

; OPcache desactivado en dev
opcache.enable = 0
opcache.enable_cli = 0
