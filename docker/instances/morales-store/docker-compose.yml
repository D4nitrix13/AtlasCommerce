# Docker Compose — Instancia Morales Store
# Sirve SOLO la tienda de tu tía.
# Deployment independiente, sin Panda ni Kitsune ni MM Boutique.

services:
  app:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.backend
    container_name: moralesstore-app
    restart: unless-stopped
    ports:
      - "8200:8000"
    volumes:
      - ./seeds:/tmp/seeds:ro
      - storage-app:/var/www/html/storage
      - bootstrap-app:/var/www/html/bootstrap/cache
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME}
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - SESSION_LIFETIME=${SESSION_LIFETIME}
      - CACHE_STORE=${CACHE_STORE}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
      - SESSION_DOMAIN=${SESSION_DOMAIN}
      - MORALES_ADMIN_PASSWORD=${MORALES_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.frontend
    container_name: moralesstore-frontend
    restart: unless-stopped
    ports:
      - "4323:4321"
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PUBLIC_APP_NAME=${PUBLIC_APP_NAME}
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=production
    depends_on:
      - app
    networks:
      - internal

  db:
    image: postgis/postgis:18-3.6
    container_name: moralesstore-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
      - ../../../database/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: moralesstore-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:

volumes:
  db-data:
  storage-app:
  bootstrap-app:
