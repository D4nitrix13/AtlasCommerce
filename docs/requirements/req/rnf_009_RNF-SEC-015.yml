# RNF: RNF-SEC-015 - RBAC con scoping por tenant
rnf_009:
  title: "RBAC con scoping por tenant"
  rationale: "Los permisos y roles de usuarios están scoped al tenant donde fueron creados. No hay roles cross-tenant."
  priority: "H"
  status: "verified"
  category: "Seguridad"
  code: "RNF-SEC-015"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "RBAC verificado vía modelos `Role`, `Permission`, `PermissionRole` y middleware `CheckPermission`. Los permisos se asignan al rol, no al usuario directo, y están scoped por tenant (`store_id`); no existe un rol global cross-tenant."