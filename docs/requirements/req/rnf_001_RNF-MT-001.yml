# RNF: RNF-MT-001 - Aislamiento de BD por tenant
rnf_001:
  title: "Aislamiento de BD por tenant"
  rationale: "Cada instancia de tienda (tenant) tiene su propia base de datos PostgreSQL dedicada, sin compartir conexiones ni esquemas. Implementado via docker/instances/<store>/ con volúmenes aislados."
  priority: "H"
  status: "verified"
  category: "Mantenibilidad / Portabilidad"
  code: "RNF-MT-001"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "Aislamiento físico verificado: cada tenant corre en `docker/instances/<store>/` con volumen `db-data` propio y `docker network` aislada. Cumple ISO 25010 §5.1.3 (Isolation) y OWASP A01:2021 al garantizar que ni siquiera un dump cruzado es posible. Verificación operacional: `docker compose ps` debe listar exactamente 3 stacks por store sin recursos compartidos."