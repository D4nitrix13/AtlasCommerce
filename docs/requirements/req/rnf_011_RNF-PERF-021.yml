# RNF: RNF-PERF-021 - Cache de aplicación en Redis
rnf_011:
  title: "Cache de aplicación en Redis"
  rationale: "El cache store por defecto es Redis (CACHE_STORE=redis). Reduce carga en PostgreSQL para consultas repetidas."
  priority: "H"
  status: "verified"
  category: "Rendimiento"
  code: "RNF-PERF-021"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "`CACHE_STORE=redis` + `php artisan config:cache` en producción. Cache de queries, config y vistas reduce latencia del primer hit; las claves usan prefijo del tenant para evitar colisiones cross-store. TTL explícito en cada llamada `Cache::remember()`."