# RNF: RNF-SEC-012 - Hashing de passwords con bcrypt
rnf_006:
  title: "Hashing de passwords con bcrypt"
  rationale: "Passwords nunca se almacenan en plaintext. Hashing via bcrypt con salt por defecto de Laravel."
  priority: "H"
  status: "verified"
  category: "Seguridad"
  code: "RNF-SEC-012"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "Cumplimiento OWASP A02:2021 (cryptographic failures). Hashing vía `Hash::make()` con bcrypt cost 12 (configurable vía `BCRYPT_ROUNDS`); Sanctum persiste tokens hasheados. Tests de seguridad validan que ningún endpoint devuelve el hash ni acepta plaintext en updates."