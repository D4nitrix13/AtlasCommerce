# RNF: RNF-MT-003 - Aislamiento total entre instancias Docker
rnf_003:
  title: "Aislamiento total entre instancias Docker"
  rationale: "Cada tienda corre como Docker stack independiente (red + volúmenes propios). No hay shared state entre tenants."
  priority: "H"
  status: "verified"
  category: "Seguridad / Portabilidad"
  code: "RNF-MT-003"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "Verificado por configuración: cada instancia declara sus propias networks (`internal`, `external`) y volúmenes en `docker/instances/<store>/docker-compose.yml`. No hay `volumes_from` ni `network_mode: service:*` cross-tenant; cumple principio de menor privilegio (NIST SP 800-53 AC-4)."