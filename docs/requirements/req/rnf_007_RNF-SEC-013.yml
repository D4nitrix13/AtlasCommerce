# RNF: RNF-SEC-013 - HTTPS obligatorio en producción
rnf_007:
  title: "HTTPS obligatorio en producción"
  rationale: "Caddy activa auto_https=on y obtiene certs de Let's Encrypt automáticamente. HTTP se redirige a HTTPS."
  priority: "H"
  status: "verified"
  category: "Seguridad"
  code: "RNF-SEC-013"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "Cumplimiento RFC 6797 (HSTS) + Let's Encrypt automático vía Caddy `auto_https=on`. Redirección HTTP→HTTPS configurada en `Caddyfile`; HSTS header aplicado por default. En dev se acepta HTTP para evitar fricción con certs self-signed."