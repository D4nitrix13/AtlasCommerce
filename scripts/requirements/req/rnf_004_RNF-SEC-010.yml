# RNF: RNF-SEC-010 - Autenticación API vía Sanctum
rnf_004:
  title: "Autenticación API vía Sanctum"
  rationale: "Todas las rutas API usan Laravel Sanctum para emitir tokens scoped por tenant. Tokens no se comparten entre instancias."
  priority: "H"
  status: "verified"
  category: "Seguridad"
  code: "RNF-SEC-010"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "Cumplimiento OWASP A07:2021. Sanctum emite tokens `plainTextToken` una sola vez; en `personal_access_tokens` se persiste solo el hash SHA-256. Los tokens están scoped por tenant vía `tokenable` + `BelongsToStore`. Verificado por `tests/Feature/Auth/SecurityBoundariesTest.php`."