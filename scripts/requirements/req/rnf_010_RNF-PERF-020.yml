# RNF: RNF-PERF-020 - Sesiones en Redis
rnf_010:
  title: "Sesiones en Redis"
  rationale: "Las sesiones PHP se guardan en Redis, no en filesystem (evita EACCES con bind mounts UID-mismatch)."
  priority: "H"
  status: "verified"
  category: "Rendimiento / Fiabilidad"
  code: "RNF-PERF-020"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "Verificado: `SESSION_DRIVER=redis` en `.env` y `config/session.php`; conexión dedicada vía `REDIS_SESSION_CONNECTION`. Resuelve el problema EACCES con bind mounts UID-mismatch. Sesiones sobreviven reinicios del contenedor PHP."