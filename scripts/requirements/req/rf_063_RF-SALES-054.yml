rf_063:
  title: "Cancelacion de orden por cliente"
  rationale: "El cliente puede cancelar su orden dentro de la ventana configurada (default 24h post-checkout) y solo si el status es 'pending' o 'confirmed'. El reembolso (si hubo cobro) se procesa via RF-PAY-073. La cancelacion registra OrderStatusHistory con motivo y, si aplica, restock."
