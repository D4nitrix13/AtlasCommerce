# RNF: RNF-PORT-082 - User no-root en runtime
rnf_030:
  title: "User no-root en runtime"
  rationale: "Los containers corren como usuario no-root (UID host bind-mount o nobody). Reducción de blast radius."
  priority: "H"
  status: "verified"
  category: "Seguridad"
  code: "RNF-PORT-082"
  version: "1.0"
  autores:
    - stakeholder_001
    - stakeholder_003
  fuentes: []
  dependencias: []
  estabilidad: "PD"
  urgencia: "importante"
  comentarios: "Verificado: USER no-root en cada Dockerfile (`USER www-data` para PHP, `USER postgres` para PG, `USER redis` para Redis). Reducción de blast radius ante RCE en cualquier servicio (CIS Docker §4.1). En dev con bind mounts se bindea el UID del host para evitar EACCES."