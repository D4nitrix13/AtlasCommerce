name: Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-info:
    name: Pre-commit local check info
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Print local pre-commit commands
        run: |
          echo "## Local pre-commit checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo 'Antes de pushear, corré estos comandos localmente:' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo '# Backend' >> $GITHUB_STEP_SUMMARY
          echo 'cd backend' >> $GITHUB_STEP_SUMMARY
          echo 'composer precommit  # = lint:dirty + analyse + test' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '# Frontend' >> $GITHUB_STEP_SUMMARY
          echo 'cd frontend' >> $GITHUB_STEP_SUMMARY
          echo 'pnpm run typecheck && pnpm run lint && pnpm exec prettier --check "src/**/*.{ts,tsx,astro,css,md}"' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '# Docs' >> $GITHUB_STEP_SUMMARY
          echo 'cd ..' >> $GITHUB_STEP_SUMMARY
          echo 'markdownlint "**/*.md" --ignore node_modules --ignore vendor --ignore dist --ignore .astro' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '# Infra (Docker — paths absolutos)' >> $GITHUB_STEP_SUMMARY
          echo './scripts/docker/quality-check.sh' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  backend-quality:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, intl, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Prepare Environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint — Code Style (dry-run)
        working-directory: backend
        run: vendor/bin/pint --test --no-interaction

      - name: PHPStan — Static Analysis
        working-directory: backend
        run: composer analyse --no-interaction

      - name: Tests (PHPUnit)
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: ecommerce_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          APP_ENV: testing
        run: composer test --no-interaction

  frontend-quality:
    name: Frontend (Astro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Astro Check (TypeScript)
        working-directory: frontend
        run: pnpm run astro -- check

      - name: Prettier — Format Check
        working-directory: frontend
        run: pnpm exec prettier --check 'src/**/*.{ts,tsx,astro,css,md}'

      - name: ESLint
        working-directory: frontend
        run: pnpm run lint

      - name: Unit Tests (Vitest)
        working-directory: frontend
        run: pnpm run test -- --reporter=verbose

  docs-quality:
    name: Docs (Markdown)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.18

      - name: Lint Markdown
        run: markdownlint-cli2 '**/*.md' '#node_modules' '#vendor' '#dist' '#.astro' '#frontend/dist' '#backend/storage' '**/*.md'

  infra-quality:
    name: Infra (Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect Docker changes
        id: docker
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^docker/' || \
             git diff --name-only origin/master...HEAD 2>/dev/null | grep -q '^docker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker Quality Check (paths absolutos)
        if: steps.docker.outputs.changed == 'true'
        run: |
          # Verifica que todos los comandos en docker/instances/*/*.sh
          # y docker/instances/*/Dockerfile* usen paths absolutos.
          # Regla: cualquier binario invocado desde RUN, CMD, ENTRYPOINT
          # debe tener ruta absoluta (mitiga PATH hijacking).
          bash ./scripts/docker/quality-check.sh

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, docs-quality, infra-quality, dependencies-audit]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ------ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Laravel) | ${{ needs.backend-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Astro)  | ${{ needs.frontend-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs (Markdown)   | ${{ needs.docs-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infra (Docker)    | ${{ needs.infra-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies audit | ${{ needs.dependencies-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Si algo fallo, corre los comandos locales del job 'Pre-commit local check info'." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.docs-quality.result }}" != "success" ] || \
             [ "${{ needs.infra-quality.result }}" != "success" ] || \
             [ "${{ needs.dependencies-audit.result }}" != "success" ]; then
            exit 1
          fi

  dependencies-audit:
    name: Dependency Audit (composer + pnpm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer audit (PHP deps)
        working-directory: backend
        # --no-dev evita auditar paquetes de testing; --audit-format json
        # produce output parseable. Falla el job si hay vulns high/critical.
        run: |
          set -e
          composer install --no-progress --no-interaction --prefer-dist --no-dev --quiet
          composer audit --no-dev --format=json > audit-backend.json 2>&1 || AUDIT_EXIT=$?
          # Mostrar resumen en cualquier caso
          composer audit --no-dev --format=plain || true
          # Fallar solo si hay advisories high/critical
          if [ "${AUDIT_EXIT:-0}" != "0" ]; then
            echo "::error::composer audit encontró vulnerabilidades — ver audit-backend.json"
            jq '.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")' audit-backend.json || true
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm audit (Node deps)
        working-directory: frontend
        # pnpm audit --audit-level=high falla solo si hay high/critical.
        run: pnpm audit --audit-level=high