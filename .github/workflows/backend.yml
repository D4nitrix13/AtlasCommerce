name: Backend CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint (lint dirty)
        working-directory: backend
        run: vendor/bin/pint --dirty --test

      - name: PHPStan static analysis
        working-directory: backend
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1G --no-progress

  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s

    env:
      APP_ENV: testing
      APP_KEY: base64:c2VjdXJlX2FwcF9rZXlfZm9yX2dpdGh1Yl9hY3Rpb25zXzMyX2J5dGVz
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: ecommerce_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run tests
        working-directory: backend
        # Excluir tests que requieren credenciales OAuth reales (Google +
        # Facebook client_id + client_secret). Esos providers no están
        # configurados en CI por seguridad (los secrets viven solo en
        # GitHub Secrets del repo del maintainer). Los tests
        # correspondientes viven bajo tests/Feature/Auth/Social*.php
        # y tests/Feature/Auth/OAuth*.php — están en grupo 'social-auth'
        # y se excluyen via --exclude-group. Re-activar cuando se
        # configuren secrets de OAuth en CI (ver docs/operations/secret-rotation.md).
        run: vendor/bin/phpunit --no-progress --exclude-group social-auth
