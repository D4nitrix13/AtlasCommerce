name: Docs CI

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - name: Install markdownlint-cli globally
        run: bun add -g markdownlint-cli
      - name: Lint markdown files
        run: markdownlint "**/*.md" --ignore node_modules --ignore vendor --ignore dist --ignore .astro --ignore 'frontend/storybook-static/**'
